version: 2

builds:
  - id: plugin
    main: ./cmd/vault-plugin-secrets-selectel-s3
    binary: vault-plugin-secrets-selectel-s3-{{ .Os }}-{{ .Arch }}
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [binary]
    name_template: "{{ .Binary }}"

checksum:
  name_template: SHA256SUMS

changelog:
  use: github
